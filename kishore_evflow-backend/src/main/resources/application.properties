spring.application.name=evflow-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/evflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:evflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:evflow}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=${PORT:8081}
